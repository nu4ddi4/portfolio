<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f8f7f4">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{siteUrl}}">
  <meta property="og:image" content="{{siteUrl}}/assets/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{siteUrl}}/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="page">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="{{name}} 홈">feentn<span>.</span></a>
      <a class="github-link" href="{{github}}" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span><span class="sr-only"> (새 탭)</span></a>
    </header>

    <main id="main">
      <section class="intro" aria-labelledby="intro-title">
        <p class="greeting">안녕하세요.</p>
        <h1 id="intro-title">{{name}}입니다<span>.</span></h1>
        <p class="intro-description">{{intro}}</p>
      </section>

      <section class="projects" id="work" aria-labelledby="work-title">
        <h2 id="work-title">프로젝트</h2>
        <ul class="project-list">{{projects}}</ul>
      </section>
    </main>

    <footer class="site-footer">
      <span>© {{year}} {{name}}</span>
      <span>feentn.com</span>
    </footer>
  </div>
</body>
</html>
