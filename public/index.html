<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f6f5f1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{siteUrl}}">
  <meta property="og:image" content="{{siteUrl}}/assets/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{siteUrl}}/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/tabs.js" type="module"></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="page">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="{{name}} 홈"><img src="/assets/favicon.svg" width="30" height="30" alt="">{{name}}</a>
      <nav aria-label="주 메뉴">
        <div class="page-tabs" aria-label="포트폴리오 섹션">
          <a id="tab-work" href="#work" data-panel="work">프로젝트</a>
          <a id="tab-about" href="#about" data-panel="about">소개</a>
        </div>
        <a href="{{github}}" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span><span class="sr-only"> (새 탭)</span></a>
      </nav>
    </header>

    <main id="main">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <h1 id="intro-title">안녕하세요, {{name}}입니다<span>.</span></h1>
          <p class="intro-description">{{intro}}</p>
        </div>
        <div class="intro-art" aria-hidden="true">
          <svg viewBox="0 0 240 240" fill="none">
            <defs><linearGradient id="orange" x1="42" y1="30" x2="192" y2="205" gradientUnits="userSpaceOnUse"><stop stop-color="#f28d50"/><stop offset="1" stop-color="#c94a23"/></linearGradient></defs>
            <g fill="url(#orange)" transform="rotate(-12 120 120)">
              <rect x="105" y="24" width="30" height="192" rx="15"/>
              <rect x="24" y="105" width="192" height="30" rx="15"/>
              <rect x="105" y="24" width="30" height="192" rx="15" transform="rotate(45 120 120)"/>
              <rect x="105" y="24" width="30" height="192" rx="15" transform="rotate(-45 120 120)"/>
            </g>
          </svg>
        </div>
      </section>

      <div class="tab-panels">
      <section class="projects" id="work" aria-labelledby="work-title">
        <div class="section-heading"><h2 id="work-title">선택한 작업<span>.</span></h2><p>직접 만든 웹 프로젝트입니다.</p></div>
        <ul class="project-list">{{projects}}</ul>
      </section>

      <section class="about" id="about" aria-labelledby="about-title">
        <div class="section-heading"><h2 id="about-title">소개<span>.</span></h2></div>
        <div class="about-content">
          <h3>{{name}}</h3>
          <p>{{about}}</p>
          <a class="about-github" href="{{github}}" target="_blank" rel="noopener noreferrer">GitHub에서 코드 보기 <span aria-hidden="true">↗</span><span class="sr-only"> (새 탭)</span></a>
        </div>
      </section>
      </div>
    </main>

    <footer class="site-footer">
      <span>© {{year}} {{name}} · feentn.com</span>
      <a href="#top">맨 위로 <span aria-hidden="true">↑</span></a>
    </footer>
  </div>
</body>
</html>
